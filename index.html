<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Med QBank</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Med QBank">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#3755a8">
<style>html,body{height:100%;margin:0;background:#000;color:#f5f5f7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}</style>
<script>window.QB_SHARED=true;window.QB_UPDATE="https://Alihby-786.github.io/med-qbank/";window.QB_LOCAL_VER=1795724520;</script>
<div class="app" id="app"><div style="padding:24px;opacity:.7">Loading Med QBank…</div></div>
<script>
(function(){
  var forceLocal=false; try{forceLocal=sessionStorage.getItem('qb-local')==='1'}catch(e){}
  function load(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.charset='utf-8';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
  function start(base,v){
    window.QB_BASE=base;
    var l=document.createElement('link');l.rel='stylesheet';l.href=base+'app.css?v='+v;document.head.appendChild(l);
    return load(base+'shell.js?v='+v).then(function(){return load(base+'lectures.js?v='+v)}).then(function(){return load(base+'app.js?v='+v)});
  }
  function local(){return start('',window.QB_LOCAL_VER)}
  if(!window.QB_UPDATE||forceLocal||navigator.onLine===false){local();return}
  var done=false, t=setTimeout(function(){if(!done){done=true;local()}},4000);
  load(window.QB_UPDATE+'version.js?t='+Date.now()).then(function(){
    if(done)return; done=true; clearTimeout(t);
    if((window.QB_REMOTE_VER||0)>window.QB_LOCAL_VER){
      start(window.QB_UPDATE,window.QB_REMOTE_VER).catch(function(){try{sessionStorage.setItem('qb-local','1')}catch(e){}location.reload()});
    } else local();
  },function(){if(!done){done=true;clearTimeout(t);local()}});
})();
</script>
<script>
/* Offline copy (website only: iPad / Mac Safari, any browser). sw.js keeps every file of the bank on the device. */
(function(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  var tip=null;
  function show(t,hide){
    if(!tip){tip=document.createElement('div');tip.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:9999;background:rgba(20,28,40,.92);color:#fff;font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap';document.body.appendChild(tip)}
    tip.textContent=t;tip.style.display='';
    if(hide)setTimeout(function(){tip.style.display='none'},hide);
  }
  navigator.serviceWorker.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='fill-progress')show('Saving for offline use… '+d.done+' / '+d.total);
    if(d.type==='fill-done'&&d.fetched)show('Saved for offline use',3000);
  });
  var had=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(had&&!reloaded){reloaded=true;location.reload()}          // a newer bank was installed: show it
    else fill();
  });
  function fill(){var c=navigator.serviceWorker.controller;if(c)c.postMessage({type:'fill'})}
  navigator.serviceWorker.register('sw.js').then(function(){fill()}).catch(function(){});
})();
</script>
